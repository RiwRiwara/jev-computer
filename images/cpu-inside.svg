<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img" aria-label="Inside the CPU: the PC addresses RAM; RAM gives the instruction to the decoder and the operand to the ALU; the ALU and register A feed each other; the ALU sets the carry flag; decoder, carry and the zero test of A choose the next PC; A writes back to RAM with STA and to the output port with OUT.">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .sub { font-size: 12px; fill: #656d76; }
    .edge { font-size: 11.5px; fill: #656d76; }
    .box { fill: #ffffff; stroke: #d0d7de; }
    .wire { stroke: #8c959f; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="819" height="359" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>

  <!-- wires (drawn first, boxes on top) -->
  <path d="M120 187 H178" class="wire" marker-end="url(#arrow)"/>
  <text x="149" y="179" class="sans edge" text-anchor="middle">address</text>

  <path d="M245 160 V77 H378" class="wire" marker-end="url(#arrow)"/>
  <text x="312" y="70" class="sans edge" text-anchor="middle">instruction</text>

  <path d="M310 187 H378" class="wire" marker-end="url(#arrow)"/>
  <text x="344" y="179" class="sans edge" text-anchor="middle">operand</text>

  <path d="M465 104 V158" class="wire" marker-end="url(#arrow)"/>
  <text x="474" y="118" class="sans edge">ADD / SUB</text>

  <path d="M550 178 H618" class="wire" marker-end="url(#arrow)"/>
  <path d="M620 198 H552" class="wire" marker-end="url(#arrow)"/>

  <path d="M465 214 V278" class="wire" marker-end="url(#arrow)"/>

  <path d="M380 305 H232" class="wire" marker-end="url(#arrow)"/>
  <text x="306" y="297" class="sans edge" text-anchor="middle">carry</text>

  <path d="M430 50 V40 H14 V305 H28" class="wire" marker-end="url(#arrow)"/>
  <text x="200" y="34" class="sans edge" text-anchor="middle">JMP / JZ / JC</text>

  <path d="M650 214 V250 H150 V276" class="wire" marker-end="url(#arrow)"/>
  <text x="560" y="244" class="sans edge" text-anchor="middle">is A zero?</text>

  <path d="M720 160 V130 H290 V158" class="wire" marker-end="url(#arrow)"/>
  <text x="640" y="124" class="sans edge" text-anchor="middle">STA (write A to RAM)</text>

  <path d="M720 214 V278" class="wire" marker-end="url(#arrow)"/>
  <text x="728" y="252" class="sans edge">OUT</text>

  <path d="M80 278 V216" class="wire" marker-end="url(#arrow)"/>

  <!-- boxes -->
  <rect x="30" y="160" width="90" height="54" rx="8" class="box"/>
  <text x="75" y="192" class="sans title" text-anchor="middle">PC</text>

  <rect x="180" y="160" width="130" height="54" rx="8" class="box"/>
  <text x="245" y="184" class="sans title" text-anchor="middle">RAM</text>
  <text x="245" y="202" class="sans sub" text-anchor="middle">256 bytes</text>

  <rect x="380" y="50" width="170" height="54" rx="8" class="box"/>
  <text x="465" y="74" class="sans title" text-anchor="middle">Instruction decoder</text>
  <text x="465" y="92" class="sans sub" text-anchor="middle">which of 11 instructions</text>

  <rect x="380" y="160" width="170" height="54" rx="8" fill="#1f2328"/>
  <text x="465" y="184" class="sans" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">ALU</text>
  <text x="465" y="202" class="sans" font-size="12" fill="#d0d7de" text-anchor="middle">add / subtract</text>

  <rect x="620" y="160" width="170" height="54" rx="8" class="box"/>
  <text x="705" y="192" class="sans title" text-anchor="middle">Register A</text>

  <rect x="30" y="280" width="200" height="54" rx="8" class="box"/>
  <text x="130" y="304" class="sans title" text-anchor="middle">Next PC</text>
  <text x="130" y="322" class="sans sub" text-anchor="middle">+2, or jump</text>

  <rect x="380" y="280" width="170" height="54" rx="8" class="box"/>
  <text x="465" y="312" class="sans title" text-anchor="middle">Carry flag</text>

  <rect x="620" y="280" width="170" height="54" rx="8" class="box"/>
  <text x="705" y="312" class="sans title" text-anchor="middle">Output port</text>
</svg>
