<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-label="Sample runs on real Jev. Every run costs 1 request, 446 input tokens, $0.000019. add 40+3 = 43 in 5 cycles, 0.81 s. mul 7x6 = 42 in 59 cycles, 0.96 s. factorial 5 = 120 in 190 cycles, 0.83 s. power 3^5 = 243 in 205 cycles, 0.83 s. gcd 48,18 = 6 in 32 cycles, 0.81 s. prime 251 = 1 in 6,263 cycles, 4.48 s. bubble_sort 6 numbers in 584 cycles, 1.14 s. fib up to 144 in 125 cycles, 0.78 s. Waiting on Jev takes 0.7 to 0.9 s each; the rest is running gates locally.">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .label { font-size: 11.5px; font-weight: 600; letter-spacing: 1.1px; fill: #656d76; }
    .name { font-size: 14px; font-weight: 600; fill: #1f2328; }
    .cell { font-size: 13px; fill: #1f2328; }
    .muted { fill: #656d76; }
    .num { font-size: 13px; fill: #1f2328; font-variant-numeric: tabular-nums; }
  </style>
  <rect x="0.5" y="0.5" width="819" height="469" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <text x="24" y="36" class="sans label">SAMPLE RUNS ON REAL JEV (jev-1.13.0)</text>
  <rect x="24" y="48" width="772" height="34" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="40" y="70" class="sans" font-size="13.5" fill="#1f2328">Every run costs the same: <tspan font-weight="700">1 Jev request · 446 input tokens · $0.000019</tspan></text>

  <!-- header -->
  <text x="24" y="112" class="sans label">PROGRAM</text>
  <text x="150" y="112" class="sans label">INPUT</text>
  <text x="300" y="112" class="sans label">ANSWER</text>
  <text x="520" y="112" class="sans label" text-anchor="end">CLOCK CYCLES</text>
  <text x="548" y="112" class="sans label">TIME</text>
  <line x1="24" y1="122" x2="796" y2="122" stroke="#d0d7de"/>

  <!-- time scale: 36 px per second, bars start at x=548 -->
  <!-- row: add -->
  <text x="24" y="148" class="mono name">add</text>
  <text x="150" y="148" class="mono cell muted">a=40 b=3</text>
  <text x="300" y="148" class="mono cell">43</text>
  <text x="520" y="148" class="sans num" text-anchor="end">5</text>
  <rect x="548" y="139" width="29" height="10" rx="3" fill="#1f2328"/>
  <rect x="577" y="139" width="1" height="10" fill="#54aeff"/>
  <text x="584" y="148" class="sans num">0.81 s</text>
  <line x1="24" y1="160" x2="796" y2="160" stroke="#eaeef2"/>

  <!-- row: mul -->
  <text x="24" y="184" class="mono name">mul</text>
  <text x="150" y="184" class="mono cell muted">a=7 b=6</text>
  <text x="300" y="184" class="mono cell">42</text>
  <text x="520" y="184" class="sans num" text-anchor="end">59</text>
  <rect x="548" y="175" width="32" height="10" rx="3" fill="#1f2328"/>
  <rect x="580" y="175" width="2" height="10" fill="#54aeff"/>
  <text x="590" y="184" class="sans num">0.96 s</text>
  <line x1="24" y1="196" x2="796" y2="196" stroke="#eaeef2"/>

  <!-- row: factorial -->
  <text x="24" y="220" class="mono name">factorial</text>
  <text x="150" y="220" class="mono cell muted">n=5</text>
  <text x="300" y="220" class="mono cell">120</text>
  <text x="520" y="220" class="sans num" text-anchor="end">190</text>
  <rect x="548" y="211" width="25" height="10" rx="3" fill="#1f2328"/>
  <rect x="573" y="211" width="5" height="10" fill="#54aeff"/>
  <text x="586" y="220" class="sans num">0.83 s</text>
  <line x1="24" y1="232" x2="796" y2="232" stroke="#eaeef2"/>

  <!-- row: power -->
  <text x="24" y="256" class="mono name">power</text>
  <text x="150" y="256" class="mono cell muted">x=3 y=5</text>
  <text x="300" y="256" class="mono cell">243</text>
  <text x="520" y="256" class="sans num" text-anchor="end">205</text>
  <rect x="548" y="247" width="25" height="10" rx="3" fill="#1f2328"/>
  <rect x="573" y="247" width="5" height="10" fill="#54aeff"/>
  <text x="586" y="256" class="sans num">0.83 s</text>
  <line x1="24" y1="268" x2="796" y2="268" stroke="#eaeef2"/>

  <!-- row: gcd -->
  <text x="24" y="292" class="mono name">gcd</text>
  <text x="150" y="292" class="mono cell muted">a=48 b=18</text>
  <text x="300" y="292" class="mono cell">6</text>
  <text x="520" y="292" class="sans num" text-anchor="end">32</text>
  <rect x="548" y="283" width="28" height="10" rx="3" fill="#1f2328"/>
  <rect x="576" y="283" width="2" height="10" fill="#54aeff"/>
  <text x="586" y="292" class="sans num">0.81 s</text>
  <line x1="24" y1="304" x2="796" y2="304" stroke="#eaeef2"/>

  <!-- row: prime -->
  <text x="24" y="328" class="mono name">prime</text>
  <text x="150" y="328" class="mono cell muted">n=251</text>
  <text x="300" y="328" class="mono cell">1 (prime)</text>
  <text x="520" y="328" class="sans num" text-anchor="end">6,263</text>
  <rect x="548" y="319" width="28" height="10" rx="3" fill="#1f2328"/>
  <rect x="576" y="319" width="133" height="10" rx="3" fill="#54aeff"/>
  <text x="716" y="328" class="sans num">4.48 s</text>
  <line x1="24" y1="340" x2="796" y2="340" stroke="#eaeef2"/>

  <!-- row: bubble_sort -->
  <text x="24" y="364" class="mono name">bubble_sort</text>
  <text x="150" y="364" class="mono cell muted">5,2,9,1,7,3</text>
  <text x="300" y="364" class="mono cell">1,2,3,5,7,9</text>
  <text x="520" y="364" class="sans num" text-anchor="end">584</text>
  <rect x="548" y="355" width="28" height="10" rx="3" fill="#1f2328"/>
  <rect x="576" y="355" width="13" height="10" fill="#54aeff"/>
  <text x="596" y="364" class="sans num">1.14 s</text>
  <line x1="24" y1="376" x2="796" y2="376" stroke="#eaeef2"/>

  <!-- row: fib -->
  <text x="24" y="400" class="mono name">fib</text>
  <text x="150" y="400" class="mono cell muted">—</text>
  <text x="300" y="400" class="mono cell">0 1 1 2 … 144</text>
  <text x="520" y="400" class="sans num" text-anchor="end">125</text>
  <rect x="548" y="391" width="25" height="10" rx="3" fill="#1f2328"/>
  <rect x="573" y="391" width="3" height="10" fill="#54aeff"/>
  <text x="584" y="400" class="sans num">0.78 s</text>

  <!-- legend -->
  <line x1="24" y1="420" x2="796" y2="420" stroke="#d0d7de"/>
  <rect x="24" y="436" width="12" height="10" rx="2" fill="#1f2328"/>
  <text x="42" y="445" class="sans" font-size="12.5" fill="#656d76">waiting on Jev (one API call, ~0.7–0.9 s)</text>
  <rect x="330" y="436" width="12" height="10" rx="2" fill="#54aeff"/>
  <text x="348" y="445" class="sans" font-size="12.5" fill="#656d76">running 24,511 gates per clock cycle locally</text>
</svg>
